[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/audio",
    "crates/core",
    "crates/library",
    "crates/spotify",
    "crates/ui",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Musify"]

[workspace.dependencies]
musify-core = { path = "crates/core" }
musify-audio = { path = "crates/audio" }
musify-library = { path = "crates/library" }
musify-ui = { path = "crates/ui" }
musify-spotify = { path = "crates/spotify" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
directories = "6"
symphonia = { version = "0.6", default-features = false, features = ["aac", "all-meta", "flac", "isomp4", "mp3", "ogg", "opt-simd", "pcm", "vorbis", "wav"] }
cpal = "0.18"
rtrb = "0.4"
lofty = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
walkdir = "2"
notify = "8"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
blake3 = "1"
souvlaki = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
